# openrouteservice configuration for the TopoScout GPX track editor.
#
# Copy to /share/www/openrouteservice/config/ors-config.yml and point source_file below at
# osm-prep's output for the .pbf you actually downloaded. Only the four profiles offered by
# the editor's dropdown are enabled — each extra profile costs build time, RAM and disk in
# direct proportion, so the four here roughly double the build time and graph disk of the
# original two.
#
# This is the ORS v8+ layout (ors.engine.profile_default.build.*, ors.engine.profiles.
# <name>.enabled). If the pinned image rejects a key, diff against the image's own
# reference config rather than guessing:
#   docker run --rm --entrypoint cat openrouteservice/openrouteservice:v10.0.1 \
#       /home/ors/ors-config.yml
server:
  port: 8082
ors:
  cors:
    # Only the toposcout container calls this, server-side, so CORS is irrelevant —
    # leaving it closed prevents any accidental direct browser use.
    allowed_origins: ""
  engine:
    # One profile at a time keeps peak heap at roughly one profile's worth instead of
    # both — the difference between fitting in 10g and not. Leave at 1 on a 16 GB host.
    init_threads: 1
    # Pages graphs off disk instead of holding them in heap, which is what makes a
    # country-sized graph comfortable on a 16 GB host. Verify the key against the image's
    # reference config (command above) before relying on it — an unknown key is silently
    # ignored by Spring's binder, so a typo shows up as memory pressure, not an error.
    graphs_data_access: MMAP
    elevation:
      # Required for `elevation: true` on the directions request. Without it ORS returns
      # 2D coordinates and every routed point lands in the GPX with no <ele>, which
      # silently flatlines the elevation profile.
      preprocessed: false
      cache_clear: false
      provider: multi
      cache_path: /home/ors/elevation_cache
      data_access: MMAP
    profile_default:
      build:
        # Regional extract. Anything outside it is served by the public openrouteservice
        # fallback in main.py, so this only needs to cover where you run most often.
        # This is osm-prep's output (openrouteservice.yaml), not the raw download: the foot
        # profiles skip highway=bridleway unless it is tagged foot=yes, and no key here
        # changes that, so the prep step adds the tag. Pointing at the raw .pbf still
        # builds, it just loses the bridleways again.
        source_file: /home/ors/files/sweden-latest-bridleways.osm.pbf
        elevation: true
        elevation_smoothing: true
    profiles:
      # Running — the editor's default, and the reason it is the default rather than
      # foot-walking: at 45.846N 7.034E (Aosta) foot-walking could not route at any snap
      # radius while cycling-mountain could, so the path is mapped and the walking profile
      # was the blocker. foot-hiking weights by SAC scale and hiking-route relations, which
      # costs some directness on mixed street/trail terrain near home but is the difference
      # between snapping and not on alpine trails.
      foot-hiking:
        enabled: true
      # Cycling paths and forest tracks, for the legs a runner shares with bikes.
      cycling-mountain:
        enabled: true
      # Plain street-network walking, without the trail weighting above. For routing through
      # a town, where foot-hiking's preference for paths and hiking relations detours.
      foot-walking:
        enabled: true
      # Roads and cycleways at road-bike speeds — the tarmac counterpart to
      # cycling-mountain, which prefers tracks.
      cycling-regular:
        enabled: true
